# Deploy control file for Reverse Minesweeper Studio (Netlify, static site).
#
# No backend and no environment variables: the solver, the fix search (a Web
# Worker), play mode and share links all run in the browser. The deploy
# workflow auto-discovers this file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.

provider: netlify
projectName: reverse-minesweeper-studio
directory: reverse-minesweeper-studio
build: npm ci && npm run build
publish: dist

# No secrets or runtime configuration are needed.
envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: reverse-minesweeper-studio
  # Pinning the id skips the listSites lookup and the create-site fallback, so
  # a deploy cannot fail by trying to re-create a name that is already taken.
  siteId: '1400712b-3786-4a7f-b2f8-3a0f41d3ecc6'
  accountSlug: yusuf-pisan
