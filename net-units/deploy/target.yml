# Deploy control file for Net Units (Netlify, static site).
#
# No backend and no environment variables: lexing, diffing, scoring and the
# guessing round all run in the browser.
# The deploy workflow auto-discovers this file via the `*/deploy/target.yml`
# glob. package-lock.json is force-added (the root .gitignore excludes
# lockfiles) because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: net-units
directory: net-units
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: net-units
  # Pinning the id skips the listSites lookup and the create-site fallback, so
  # a deploy cannot fail by trying to re-create a name that is already taken.
  siteId: '825331a0-3dbc-409c-9d75-6b48367c9054'
  accountSlug: yusuf-pisan
