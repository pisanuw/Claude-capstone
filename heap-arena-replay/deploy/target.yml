# Deploy control file for Heap Arena Replay (Netlify, static site).
#
# No backend and no environment variables: the heap simulator, the policy
# comparison, the quiz generator with its QTI export, the trace diff and
# share links all run in the browser. The deploy workflow auto-discovers this
# file via the `*/deploy/target.yml` glob. package-lock.json is force-added
# (the root .gitignore excludes lockfiles) because `npm ci` below needs it.

provider: netlify
projectName: heap-arena-replay
directory: heap-arena-replay
build: npm ci && npm run build
publish: dist

# No secrets or runtime configuration are needed. (Touching this file is how a
# source-only change gets redeployed: the workflow deploys targets whose
# target.yml changed in the push.)
envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: heap-arena-replay
  # Pinning the id skips the listSites lookup and the create-site fallback, so
  # a deploy cannot fail by trying to re-create a name that is already taken.
  siteId: '04829ded-f2d8-4548-be77-441a16530dc5'
  accountSlug: yusuf-pisan
