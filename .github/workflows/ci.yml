name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  accessibility-lens:
    name: accessibility-lens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accessibility-lens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: accessibility-lens/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

