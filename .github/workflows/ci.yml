name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  accessibility-lens:
    name: accessibility-lens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accessibility-lens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: accessibility-lens/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  mult-streak:
    name: mult-streak
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mult-streak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mult-streak/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  mult-streak-edge:
    name: mult-streak-edge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mult-streak-edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mult-streak-edge/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  backend-hub:
    name: backend-hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend-hub/package-lock.json

      # The hub consumes mult-streak as a file: dependency, so build it first.
      - name: Build mult-streak dependency
        run: npm run deps

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  schema-storyteller:
    name: schema-storyteller
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schema-storyteller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
