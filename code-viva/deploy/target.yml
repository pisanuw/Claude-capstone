# Deploy control file for Code Viva (Netlify, static site).
#
# No backend and no environment variables: question generation, the student
# session, scoring and the GitHub Classroom import (browser to api.github.com
# with the instructor's own token) all run in the browser. The deploy workflow
# auto-discovers this file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: code-viva
directory: code-viva
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: code-viva
  # Pinning the id skips the listSites lookup and the create-site fallback, so
  # a deploy cannot fail by trying to re-create a name that is already taken.
  siteId: 'dfd9d1b8-2296-4070-b15e-adffc0525b01'
  accountSlug: yusuf-pisan
