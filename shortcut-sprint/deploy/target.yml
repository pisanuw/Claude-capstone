# Deploy control file for Shortcut Sprint (Netlify, static site).
#
# No backend and no environment variables: SM-2 scheduling, key capture, and
# stats are deterministic client-side logic with progress in localStorage.
# The deploy workflow auto-discovers this file via the `*/deploy/target.yml`
# glob.

provider: netlify
projectName: shortcut-sprint
directory: shortcut-sprint
build: npm ci && npm run build
publish: dist

# No secrets or runtime configuration are needed.
envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: shortcut-sprint
  accountSlug: yusuf-pisan
