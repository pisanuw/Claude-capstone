# Deploy control file for Program Alarm 1202 (Netlify, static site).
#
# No backend and no environment variables: the Executive simulation, the
# descent model, the scheduler comparison and share links all run in the
# browser. The deploy workflow auto-discovers this file via the
# `*/deploy/target.yml` glob. package-lock.json is force-added (the root
# .gitignore excludes lockfiles) because `npm ci` below needs it.

provider: netlify
projectName: program-alarm-1202
directory: program-alarm-1202
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: program-alarm-1202
  accountSlug: yusuf-pisan
