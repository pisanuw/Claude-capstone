# Deploy control file for Cron Cartographer (Netlify, static site).
#
# No backend and no environment variables: cron/RRULE/GitHub Actions parsing,
# natural-language conversion, time-zone math, and share-link encoding are all
# deterministic client-side logic. The deploy workflow auto-discovers this
# file via the `*/deploy/target.yml` glob.

provider: netlify
projectName: cron-cartographer
directory: cron-cartographer
build: npm ci && npm run build
publish: dist

# No secrets or runtime configuration are needed.
# (Touch this file to retrigger a deploy: the workflow deploys changed target.ymls.)
envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: cron-cartographer
  # Pinning the id skips the listSites lookup and the create-site fallback, so
  # a deploy cannot fail by trying to re-create a name that is already taken.
  siteId: 'ab70c7b3-72d2-4775-821f-e5d2a7634bc5'
  accountSlug: yusuf-pisan
