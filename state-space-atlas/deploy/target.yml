# Deploy control file for State Space Atlas (Netlify, static site).
#
# No backend and no environment variables: state enumeration (a Web Worker),
# layout, the animated searches, the heuristic checker and challenge links all
# run in the browser. The deploy workflow auto-discovers this file via the
# `*/deploy/target.yml` glob. package-lock.json is force-added (the root
# .gitignore excludes lockfiles) because `npm ci` below needs it.

provider: netlify
projectName: state-space-atlas
directory: state-space-atlas
build: npm ci && npm run build
publish: dist

# No secrets or runtime configuration are needed.
envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: state-space-atlas
  accountSlug: yusuf-pisan
