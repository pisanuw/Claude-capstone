# Deploy control file for Letter Ledger (Netlify, static site).
#
# No backend and no environment variables: the request form, packet sealing,
# the ledger, calendar reminders and outlines all run in the browser. The
# deploy workflow auto-discovers this file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: letter-ledger
directory: letter-ledger
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: letter-ledger
  # Pinning the id skips the listSites lookup and the create-site fallback, so
  # a deploy cannot fail by trying to re-create a name that is already taken.
  siteId: 'b559e14a-f350-450f-97fe-0121cf76c393'
  accountSlug: yusuf-pisan
