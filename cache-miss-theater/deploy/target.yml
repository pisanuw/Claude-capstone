# Deploy control file for Cache Miss Theater (Netlify, static site).
#
# No backend and no environment variables: the parser, the trace generator,
# the cache simulator, sweeps and the question generator all run in the
# browser. The deploy workflow auto-discovers this file via the
# `*/deploy/target.yml` glob. package-lock.json is force-added (the root
# .gitignore excludes lockfiles) because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: cache-miss-theater
directory: cache-miss-theater
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: cache-miss-theater
  accountSlug: yusuf-pisan
