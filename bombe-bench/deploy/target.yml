# Deploy control file for Bombe Bench (Netlify, static site).
#
# No backend and no environment variables: the Enigma, the crib tooling, the
# Bombe search (a Web Worker) and challenge links all run in the browser. The
# deploy workflow auto-discovers this file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.

provider: netlify
projectName: bombe-bench
directory: bombe-bench
build: npm ci && npm run build
publish: dist

# No secrets or runtime configuration are needed. (Touching this file is how a
# source-only change gets redeployed: the workflow deploys targets whose
# target.yml changed in the push.)
envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: bombe-bench
  accountSlug: yusuf-pisan
