# Deploy control file for Assignment Stress Test (Netlify, static site).
#
# No backend and no environment variables: instructors paste their own
# Anthropic API key into the page, which calls api.anthropic.com directly from
# their browser; pytest runs in Pyodide (loaded from jsDelivr) in a Web Worker.
# The deploy workflow auto-discovers this file via the `*/deploy/target.yml`
# glob. package-lock.json is force-added (the root .gitignore excludes
# lockfiles) because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: assignment-stress-test
directory: assignment-stress-test
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: assignment-stress-test
  accountSlug: yusuf-pisan
